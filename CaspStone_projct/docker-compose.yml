services:
  postgres:
    image: postgres:16-alpine
    container_name: nodejs-capstone-project
    restart: unless-stopped
    environment:
      POSTGRES_DB: capstone_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rajkumar
    ports:
      - "5435:5432"
    volumes:
      - capstone_db:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: nodejs-capstone-project-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
  
volumes:
  capstone_db:
  redis_data: